<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 640" width="400" height="640" role="img" aria-labelledby="t d" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif">
  <title id="t">Le trajet d'un fichier, de votre ordinateur à l'écran du visiteur</title>
  <desc id="d">Un fichier modifié sur votre ordinateur est envoyé par FTP (étape 1, l'envoi), rangé dans le dossier du site sur le serveur (étape 2, l'emplacement), lu par le site pour construire la page (étape 3, la lecture), puis peut être gardé en mémoire par des caches avant d'arriver chez le visiteur (étape 4, les caches). Le problème peut se situer à chacune de ces quatre étapes.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1 9 5 1 9" fill="none" stroke="#171717" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="400" height="640" rx="28" fill="#F8F7F3"/>

  <!-- Ordinateur -->
  <rect x="100" y="28" width="200" height="60" rx="14" fill="#fff" stroke="#171717" stroke-width="1.5"/>
  <text x="200" y="54" font-size="14" font-weight="600" fill="#171717" text-anchor="middle">Votre ordinateur</text>
  <text x="200" y="73" font-size="12" fill="#5C5B56" text-anchor="middle">le fichier modifié</text>

  <path d="M200 92V140" stroke="#171717" stroke-width="1.5" marker-end="url(#a)"/>
  <circle cx="226" cy="116" r="15" fill="#F05B3F" stroke="#171717" stroke-width="1.5"/>
  <text x="226" y="121" font-size="13" font-weight="700" fill="#171717" text-anchor="middle">1</text>
  <text x="250" y="112" font-size="12.5" font-weight="600" fill="#171717">L'envoi</text>
  <text x="250" y="128" font-size="11.5" fill="#5C5B56">par FTP / SFTP</text>

  <!-- Serveur / dossier -->
  <rect x="60" y="146" width="280" height="118" rx="20" fill="#fff" stroke="#171717" stroke-width="1.5"/>
  <text x="200" y="172" font-size="14" font-weight="600" fill="#171717" text-anchor="middle">Le serveur de l'hébergeur</text>
  <rect x="84" y="186" width="232" height="60" rx="10" fill="#F8F7F3" stroke="#8A8983" stroke-width="1"/>
  <text x="200" y="210" font-size="12.5" fill="#171717" text-anchor="middle">le dossier lu par le site</text>
  <text x="200" y="230" font-size="11.5" fill="#5C5B56" text-anchor="middle" font-family="IBM Plex Mono, Menlo, monospace">public_html, www…</text>
  <circle cx="40" cy="216" r="15" fill="#F05B3F" stroke="#171717" stroke-width="1.5"/>
  <text x="40" y="221" font-size="13" font-weight="700" fill="#171717" text-anchor="middle">2</text>

  <path d="M200 268V316" stroke="#171717" stroke-width="1.5" marker-end="url(#a)"/>
  <circle cx="226" cy="292" r="15" fill="#F05B3F" stroke="#171717" stroke-width="1.5"/>
  <text x="226" y="297" font-size="13" font-weight="700" fill="#171717" text-anchor="middle">3</text>
  <text x="250" y="288" font-size="12.5" font-weight="600" fill="#171717">La lecture</text>
  <text x="250" y="304" font-size="11.5" fill="#5C5B56">par le site</text>

  <!-- Site -->
  <rect x="100" y="322" width="200" height="60" rx="14" fill="#fff" stroke="#171717" stroke-width="1.5"/>
  <text x="200" y="348" font-size="14" font-weight="600" fill="#171717" text-anchor="middle">Votre site</text>
  <text x="200" y="367" font-size="12" fill="#5C5B56" text-anchor="middle">WordPress, fichiers, base</text>

  <path d="M200 386V424" stroke="#171717" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- Caches -->
  <rect x="60" y="430" width="280" height="104" rx="20" fill="#FBE3DC" stroke="#B8391F" stroke-width="1.5"/>
  <text x="200" y="456" font-size="14" font-weight="600" fill="#171717" text-anchor="middle">Les caches</text>
  <text x="200" y="476" font-size="12" fill="#5C5B56" text-anchor="middle">des copies gardées en mémoire</text>
  <rect x="78" y="488" width="76" height="30" rx="15" fill="#fff" stroke="#B8391F" stroke-width="1"/>
  <text x="116" y="507" font-size="11" fill="#171717" text-anchor="middle">hébergeur</text>
  <rect x="162" y="488" width="76" height="30" rx="15" fill="#fff" stroke="#B8391F" stroke-width="1"/>
  <text x="200" y="507" font-size="11" fill="#171717" text-anchor="middle">Cloudflare</text>
  <rect x="246" y="488" width="76" height="30" rx="15" fill="#fff" stroke="#B8391F" stroke-width="1"/>
  <text x="284" y="507" font-size="11" fill="#171717" text-anchor="middle">navigateur</text>
  <circle cx="40" cy="482" r="15" fill="#F05B3F" stroke="#171717" stroke-width="1.5"/>
  <text x="40" y="487" font-size="13" font-weight="700" fill="#171717" text-anchor="middle">4</text>

  <path d="M200 538V570" stroke="#171717" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- Visiteur -->
  <rect x="120" y="576" width="160" height="44" rx="22" fill="#fff" stroke="#171717" stroke-width="1.5"/>
  <text x="200" y="603" font-size="14" font-weight="600" fill="#171717" text-anchor="middle">Le visiteur</text>
</svg>
