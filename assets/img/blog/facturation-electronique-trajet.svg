<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 640" width="400" height="640" role="img" aria-labelledby="t d" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif">
  <title id="t">Le trajet d'une facture électronique</title>
  <desc id="d">Le fournisseur prépare sa facture dans son logiciel ou sur sa plateforme. Sa plateforme agréée consulte l'annuaire pour savoir quelle plateforme a choisie le client, puis lui transmet la facture. La plateforme du client la met à sa disposition. En parallèle, la plateforme du fournisseur extrait seulement certaines données de la facture et les transmet à l'administration fiscale. Les deux plateformes peuvent être la même.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1 9 5 1 9" fill="none" stroke="#171717" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1 9 5 1 9" fill="none" stroke="#5C5B56" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="400" height="640" rx="28" fill="#F8F7F3"/>

  <!-- 1. Fournisseur -->
  <rect x="60" y="28" width="280" height="68" rx="34" fill="#fff" stroke="#171717" stroke-width="1.5"/>
  <circle cx="92" cy="62" r="13" fill="#F8F7F3" stroke="#171717" stroke-width="1.5"/>
  <text x="92" y="67" font-size="13" font-weight="600" fill="#171717" text-anchor="middle">1</text>
  <text x="116" y="57" font-size="14" font-weight="600" fill="#171717">Le fournisseur</text>
  <text x="116" y="77" font-size="11.5" fill="#5C5B56">prépare la facture (logiciel)</text>

  <path d="M200 100V140" stroke="#171717" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- 2. Plateforme du fournisseur -->
  <rect x="40" y="146" width="320" height="96" rx="20" fill="#fff" stroke="#171717" stroke-width="1.5"/>
  <circle cx="72" cy="178" r="13" fill="#F8F7F3" stroke="#171717" stroke-width="1.5"/>
  <text x="72" y="183" font-size="13" font-weight="600" fill="#171717" text-anchor="middle">2</text>
  <text x="96" y="174" font-size="14" font-weight="600" fill="#171717">Sa plateforme agréée</text>
  <text x="96" y="193" font-size="11.5" fill="#5C5B56">contrôle le fichier, puis cherche</text>
  <text x="96" y="210" font-size="11.5" fill="#5C5B56">où l'envoyer dans l'annuaire</text>
  <rect x="96" y="218" width="112" height="18" rx="9" fill="#F8F7F3" stroke="#8A8983"/>
  <text x="152" y="231" font-size="10.5" fill="#171717" text-anchor="middle">annuaire : client → B</text>

  <path d="M200 246V286" stroke="#171717" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- 3. Plateforme du client -->
  <rect x="40" y="292" width="320" height="78" rx="20" fill="#fff" stroke="#171717" stroke-width="1.5"/>
  <circle cx="72" cy="324" r="13" fill="#F8F7F3" stroke="#171717" stroke-width="1.5"/>
  <text x="72" y="329" font-size="13" font-weight="600" fill="#171717" text-anchor="middle">3</text>
  <text x="96" y="320" font-size="14" font-weight="600" fill="#171717">La plateforme du client · B</text>
  <text x="96" y="340" font-size="11.5" fill="#5C5B56">reçoit la facture ; peut être</text>
  <text x="96" y="357" font-size="11.5" fill="#5C5B56">la même que celle du fournisseur</text>

  <path d="M200 374V414" stroke="#171717" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- 4. Client -->
  <rect x="60" y="420" width="280" height="68" rx="34" fill="#fff" stroke="#171717" stroke-width="1.5"/>
  <circle cx="92" cy="454" r="13" fill="#F8F7F3" stroke="#171717" stroke-width="1.5"/>
  <text x="92" y="459" font-size="13" font-weight="600" fill="#171717" text-anchor="middle">4</text>
  <text x="116" y="449" font-size="14" font-weight="600" fill="#171717">Le client</text>
  <text x="116" y="469" font-size="11.5" fill="#5C5B56">la consulte, suit son statut</text>

  <!-- Données vers l'administration -->
  <path d="M40 194H22V556H52" fill="none" stroke="#5C5B56" stroke-width="1.5" stroke-dasharray="5 5" marker-end="url(#ag)"/>
  <rect x="58" y="516" width="302" height="96" rx="20" fill="#EFEDE6" stroke="#8A8983" stroke-width="1.2" stroke-dasharray="5 5"/>
  <text x="80" y="544" font-size="14" font-weight="600" fill="#171717">L'administration fiscale</text>
  <text x="80" y="565" font-size="11.5" fill="#3A3A37">reçoit seulement certaines données</text>
  <text x="80" y="582" font-size="11.5" fill="#3A3A37">extraites par la plateforme (montants,</text>
  <text x="80" y="599" font-size="11.5" fill="#3A3A37">TVA, identifiants), pas la facture entière</text>
</svg>
