<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 720" width="400" height="720" role="img" aria-labelledby="t d" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif">
  <title id="t">Garder son logiciel de facturation : les questions à se poser</title>
  <desc id="d">Première question : votre logiciel est-il relié à une plateforme agréée et sait-il produire une facture électronique ? Si oui, c'est une solution compatible, il suffit de vérifier les réglages. Sinon, deuxième question : l'éditeur prévoit-il une mise à jour ? Si oui, planifiez-la. Sinon, troisième question : que sait exporter le logiciel ? Un export structuré complet, par exemple un fichier CSV ou XML, permet d'envisager une transformation vers un format accepté, à condition que les informations nécessaires existent. Sans export exploitable, il faut envisager un autre outil ou la saisie sur la plateforme.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1 9 5 1 9" fill="none" stroke="#171717" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="400" height="720" rx="28" fill="#F8F7F3"/>

  <!-- Q1 -->
  <rect x="24" y="24" width="352" height="74" rx="18" fill="#fff" stroke="#171717" stroke-width="1.5"/>
  <text x="42" y="50" font-size="13.5" font-weight="600" fill="#171717">1. Relié à une plateforme agréée,</text>
  <text x="42" y="69" font-size="13.5" font-weight="600" fill="#171717">et capable de produire une facture</text>
  <text x="42" y="88" font-size="13.5" font-weight="600" fill="#171717">électronique ?</text>
  <path d="M100 102V126" stroke="#171717" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="108" y="120" font-size="11.5" font-weight="600" fill="#1E6B45">oui</text>
  <rect x="24" y="132" width="168" height="62" rx="16" fill="#DCEFE3" stroke="#1E6B45" stroke-width="1.5"/>
  <text x="108" y="158" font-size="12" font-weight="600" fill="#171717" text-anchor="middle">Solution compatible</text>
  <text x="108" y="177" font-size="11" fill="#1E6B45" text-anchor="middle">vérifier les réglages</text>
  <path d="M300 102V230" stroke="#171717" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="308" y="156" font-size="11.5" font-weight="600" fill="#5C5B56">non</text>

  <!-- Q2 -->
  <rect x="24" y="236" width="352" height="56" rx="18" fill="#fff" stroke="#171717" stroke-width="1.5"/>
  <text x="42" y="260" font-size="13.5" font-weight="600" fill="#171717">2. L'éditeur prévoit-il une mise à jour</text>
  <text x="42" y="279" font-size="13.5" font-weight="600" fill="#171717">qui le rende compatible ?</text>
  <path d="M100 296V320" stroke="#171717" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="108" y="314" font-size="11.5" font-weight="600" fill="#1E6B45">oui</text>
  <rect x="24" y="326" width="168" height="62" rx="16" fill="#DCEFE3" stroke="#1E6B45" stroke-width="1.5"/>
  <text x="108" y="352" font-size="12" font-weight="600" fill="#171717" text-anchor="middle">Mise à jour</text>
  <text x="108" y="371" font-size="11" fill="#1E6B45" text-anchor="middle">obtenir une date</text>
  <path d="M300 296V424" stroke="#171717" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="308" y="350" font-size="11.5" font-weight="600" fill="#5C5B56">non</text>

  <!-- Q3 -->
  <rect x="24" y="430" width="352" height="56" rx="18" fill="#fff" stroke="#171717" stroke-width="1.5"/>
  <text x="42" y="454" font-size="13.5" font-weight="600" fill="#171717">3. Que sait-il exporter ?</text>
  <text x="42" y="473" font-size="11.5" fill="#5C5B56">fichier CSV, XML propre au logiciel, API…</text>
  <path d="M100 490V514" stroke="#171717" stroke-width="1.5" marker-end="url(#a)"/>
  <path d="M300 490V514" stroke="#171717" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="24" y="520" width="168" height="112" rx="16" fill="#F6E7C4" stroke="#8A5A00" stroke-width="1.5"/>
  <text x="108" y="544" font-size="12" font-weight="600" fill="#171717" text-anchor="middle">Export structuré</text>
  <text x="108" y="566" font-size="11" fill="#8A5A00" text-anchor="middle">transformation possible</text>
  <text x="108" y="583" font-size="11" fill="#8A5A00" text-anchor="middle">si les informations</text>
  <text x="108" y="600" font-size="11" fill="#8A5A00" text-anchor="middle">nécessaires existent,</text>
  <text x="108" y="617" font-size="11" fill="#8A5A00" text-anchor="middle">avec des contrôles</text>
  <rect x="208" y="520" width="168" height="112" rx="16" fill="#F6DCE5" stroke="#A3194A" stroke-width="1.5"/>
  <text x="292" y="544" font-size="12" font-weight="600" fill="#171717" text-anchor="middle">Rien d'exploitable</text>
  <text x="292" y="566" font-size="11" fill="#A3194A" text-anchor="middle">autre logiciel, ou</text>
  <text x="292" y="583" font-size="11" fill="#A3194A" text-anchor="middle">création des factures</text>
  <text x="292" y="600" font-size="11" fill="#A3194A" text-anchor="middle">sur la plateforme</text>

  <text x="200" y="672" font-size="11.5" fill="#3A3A37" text-anchor="middle">Dans tous les cas, la facture part</text>
  <text x="200" y="690" font-size="11.5" fill="#3A3A37" text-anchor="middle">par une plateforme agréée.</text>
</svg>
