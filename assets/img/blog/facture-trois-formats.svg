<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 660" width="400" height="660" role="img" aria-labelledby="t d" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif">
  <title id="t">Une facture, trois formats</title>
  <desc id="d">La même facture fictive d'Atelier Martin, numéro FAC-2026-001, 1 200 euros toutes taxes comprises, peut être écrite en UBL, un fichier de données XML, en CII, un autre fichier de données XML, ou en Factur-X, un PDF lisible par une personne qui contient en pièce jointe un fichier de données au format CII. Les informations sont les mêmes ; seuls leur rangement et leurs noms changent.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1 9 5 1 9" fill="none" stroke="#171717" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="400" height="660" rx="28" fill="#F8F7F3"/>

  <!-- La facture commerciale -->
  <rect x="70" y="26" width="260" height="104" rx="18" fill="#fff" stroke="#171717" stroke-width="1.5"/>
  <text x="92" y="54" font-size="14" font-weight="600" fill="#171717">Facture FAC-2026-001</text>
  <text x="92" y="74" font-size="11.5" fill="#5C5B56">Atelier Martin (entreprise fictive)</text>
  <text x="92" y="98" font-size="12" fill="#3A3A37">1 000 € HT · TVA 200 €</text>
  <text x="92" y="117" font-size="12.5" font-weight="600" fill="#171717">1 200 € TTC</text>

  <path d="M200 134V168" stroke="#171717" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="212" y="157" font-size="11.5" fill="#5C5B56">écrite au choix en…</text>

  <!-- UBL -->
  <rect x="40" y="176" width="320" height="104" rx="16" fill="#fff" stroke="#171717" stroke-width="1.5"/>
  <rect x="40" y="176" width="320" height="30" rx="16" fill="#3A3A37"/>
  <rect x="40" y="192" width="320" height="14" fill="#3A3A37"/>
  <text x="58" y="196" font-size="12.5" font-weight="600" fill="#fff">UBL</text>
  <text x="342" y="196" font-size="11" fill="#EFEDE6" text-anchor="end">fichier de données XML</text>
  <text x="58" y="230" font-family="IBM Plex Mono, Consolas, monospace" font-size="11.5" fill="#171717">&lt;cbc:ID&gt;FAC-2026-001&lt;/cbc:ID&gt;</text>
  <text x="58" y="250" font-family="IBM Plex Mono, Consolas, monospace" font-size="11.5" fill="#171717">&lt;cbc:TaxInclusiveAmount&gt;</text>
  <text x="74" y="268" font-family="IBM Plex Mono, Consolas, monospace" font-size="11.5" fill="#171717">1200.00 …</text>

  <!-- CII -->
  <rect x="40" y="296" width="320" height="104" rx="16" fill="#fff" stroke="#171717" stroke-width="1.5"/>
  <rect x="40" y="296" width="320" height="30" rx="16" fill="#3A3A37"/>
  <rect x="40" y="312" width="320" height="14" fill="#3A3A37"/>
  <text x="58" y="316" font-size="12.5" font-weight="600" fill="#fff">CII</text>
  <text x="342" y="316" font-size="11" fill="#EFEDE6" text-anchor="end">fichier de données XML</text>
  <text x="58" y="350" font-family="IBM Plex Mono, Consolas, monospace" font-size="11.5" fill="#171717">&lt;ram:ID&gt;FAC-2026-001&lt;/ram:ID&gt;</text>
  <text x="58" y="370" font-family="IBM Plex Mono, Consolas, monospace" font-size="11.5" fill="#171717">&lt;ram:GrandTotalAmount&gt;</text>
  <text x="74" y="388" font-family="IBM Plex Mono, Consolas, monospace" font-size="11.5" fill="#171717">1200.00 …</text>

  <!-- Factur-X -->
  <rect x="40" y="416" width="320" height="176" rx="16" fill="#fff" stroke="#171717" stroke-width="1.5"/>
  <text x="58" y="442" font-size="12.5" font-weight="600" fill="#171717">Factur-X</text>
  <text x="342" y="442" font-size="11" fill="#5C5B56" text-anchor="end">un PDF avec une pièce jointe</text>
  <!-- page PDF -->
  <rect x="58" y="456" width="120" height="120" rx="8" fill="#F8F7F3" stroke="#8A8983"/>
  <text x="118" y="478" font-size="11" font-weight="600" fill="#171717" text-anchor="middle">page PDF</text>
  <path d="M72 492H164M72 506H150M72 520H160M72 534H140" stroke="#B7B7B2" stroke-width="2" stroke-linecap="round"/>
  <text x="118" y="562" font-size="11" fill="#5C5B56" text-anchor="middle">pour la personne</text>
  <!-- pièce jointe CII -->
  <path d="M186 516H210" stroke="#171717" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="216" y="474" width="128" height="84" rx="10" fill="#fff" stroke="#171717" stroke-width="1.5"/>
  <text x="280" y="500" font-family="IBM Plex Mono, Consolas, monospace" font-size="11" fill="#171717" text-anchor="middle">factur-x.xml</text>
  <text x="280" y="520" font-size="11" fill="#3A3A37" text-anchor="middle">données au</text>
  <text x="280" y="536" font-size="11" fill="#3A3A37" text-anchor="middle">format CII</text>
  <text x="280" y="574" font-size="11" fill="#5C5B56" text-anchor="middle">pour le logiciel</text>

  <text x="200" y="626" font-size="12" fill="#3A3A37" text-anchor="middle">Mêmes informations, rangées et nommées autrement.</text>
</svg>
