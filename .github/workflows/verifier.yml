name: Vérifier le site
on:
  push:
  pull_request:
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Les fichiers générés sont à jour
        run: |
          npm run build
          git diff --exit-code -- '*.html' sitemap.xml blog
